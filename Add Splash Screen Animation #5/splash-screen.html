<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App with Splash Screen</title>
    <!-- 1. Include Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Include Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* 3. Set Inter as the default font */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* 4. Define custom keyframe animations */
        
        /* Splash screen content animation */
        @keyframes fadeInZoomLift {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        /* NEW: Main content animation (fades and slides up) */
        @keyframes fadeInUp {
            from { 
                opacity: 0;
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        /* NEW: Spinner animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 5. Utility classes to apply the animations */
        
        .animate-fade-zoom-lift {
            animation: fadeInZoomLift 1.2s cubic-bezier(0.215, 0.610, 0.355, 1) forwards;
        }

        /* NEW: Use the fadeInUp animation */
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .start-hidden {
            opacity: 0;
        }

        /* NEW: CSS for the loading spinner */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 1s ease-in-out infinite;
            margin-top: 24px; /* Added space */
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- 
      Splash Screen
    -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 text-white transition-opacity duration-500 ease-out">
        
        <!-- Animated Content Container -->
        <div class="flex flex-col items-center justify-center start-hidden" id="splash-content">
            
            <!-- Abstract App Logo -->
            <svg class="w-24 h-24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="white" fill-opacity="0.1"/>
                <path d="M2 17L12 22L22 17L12 12L2 17Z" fill="white" fill-opacity="0.6"/>
                <path d="M2 7L12 12L22 7L12 17L2 7Z" fill="white"/>
            </svg>
            
            <!-- App Name -->
            <h1 class="text-4xl font-bold mt-5 tracking-tight">MyApp</h1>
            <p class="text-lg text-indigo-100 font-light">Loading your experience...</p>
            
            <!-- NEW: Loading Spinner -->
            <div class="spinner"></div>
        </div>
    </div>

    <!-- 
      Main App Content
    -->
    <main id="main-content" class="hidden start-hidden container mx-auto p-4 sm:p-8">
        
        <!-- NEW: App Header -->
        <header class="mb-6 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-900">Dashboard</h1>
            <div class="flex items-center space-x-2">
                <!-- Search Button -->
                <button class="p-2 rounded-full text-gray-500 hover:text-gray-900 hover:bg-gray-200 transition-colors">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
                <!-- Notifications Button -->
                <button class="p-2 rounded-full text-gray-500 hover:text-gray-900 hover:bg-gray-200 transition-colors">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                </button>
                <!-- Profile Avatar -->
                <img class="w-10 h-10 rounded-full cursor-pointer" src="https://placehold.co/100x100/E2E8F0/4A5568?text=User" alt="User profile"
                     onerror="this.onerror=null; this.src='https://placehold.co/100x100/E2E8F0/4A5568?text=U'">
            </div>
        </header>

        <!-- Main Card -->
        <div class="bg-white p-8 sm:p-10 rounded-xl shadow-2xl shadow-gray-300/30">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Welcome Home!</h1>
            <p class="text-gray-700 text-lg mb-2">
                The splash screen has successfully finished, and you are now in the main application.
            </p>
            <p class="text-gray-600">
                This content was hidden until the splash screen animation completed its 1.5-second duration,
                and then it faded in smoothly.
            </p>
            <button class="mt-8 px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition-all transform hover:scale-105">
                Get Started
            </button>
        </div>
    </main>

    <script>
        // 6. JavaScript to control the flow (Updated animation class)
        document.addEventListener("DOMContentLoaded", function() {
            
            const splashScreen = document.getElementById('splash-screen');
            const splashContent = document.getElementById('splash-content');
            const mainContent = document.getElementById('main-content');
            
            const SPLASH_DURATION = 1500; // 1.5 seconds

            // 1. Start the splash animation
            splashContent.classList.remove('start-hidden');
            splashContent.classList.add('animate-fade-zoom-lift');

            // 2. Set a timer to end the splash screen
            setTimeout(() => {
                // 3. Start fading out the splash screen
                splashScreen.classList.add('opacity-0');

                // 4. Un-hide the main content
                mainContent.classList.remove('hidden');

                // 5. Start fading in the main content
                setTimeout(() => {
                    mainContent.classList.remove('start-hidden');
                    // NEW: Use the new fadeInUp animation
                    mainContent.classList.add('animate-fade-in-up');
                }, 50);

                // 6. After fade-out, hide splash screen to allow interaction
                splashScreen.addEventListener('transitionend', (e) => {
                    if (e.propertyName === 'opacity') {
                        splashScreen.style.display = 'none';
                    }
                });

            }, SPLASH_DURATION);
        });
    </script>

</body>
</html>
